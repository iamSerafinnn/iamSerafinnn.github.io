<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <!-- Lockup: S monogram + "SERAFIN portfolio" wordmark -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g>
    <rect x="20" y="20" width="280" height="280" rx="66" fill="#0f172a"/>
    <rect x="20" y="20" width="280" height="280" rx="66" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="3"/>
    <path d="M 216 102
             C 216 80 193 67 161 67
             C 127 67 104 83 104 109
             C 104 133 125 144 158 152
             C 193 161 216 172 216 202
             C 216 233 189 251 156 251
             C 123 251 101 236 99 211"
          fill="none"
          stroke="url(#accent)"
          stroke-width="26"
          stroke-linecap="round"/>
    <circle cx="99" cy="211" r="8" fill="#e5e7eb"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Syne', 'Avenir Next', 'Futura', sans-serif">
    <text x="352" y="172" font-size="104" font-weight="800" letter-spacing="6" fill="#e5e7eb">SERAFIN</text>
    <text x="356" y="240" font-size="46" font-weight="500" letter-spacing="14" fill="#38bdf8">ENTRY PORTFOLIO</text>
  </g>
</svg>
